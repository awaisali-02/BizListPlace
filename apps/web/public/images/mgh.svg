<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mghGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="#F1F5F9"/>
  
  <!-- Centered Large Shield Motif from screenshot -->
  <g transform="translate(175, 10)">
    <path d="M0 0 L250 0 C250 160 250 250 125 320 C0 250 0 160 0 0 Z" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="4"/>
    
    <!-- Classical Hospital Dome / Pediment Roof -->
    <polygon points="125,25 65,55 185,55" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="75" y="55" width="100" height="10" fill="#FFFFFF"/>
    
    <!-- MGH bold typography -->
    <text x="125" y="165" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MGH</text>
    
    <!-- 1811 year -->
    <text x="125" y="235" font-family="Times New Roman, serif" font-size="44" font-weight="bold" fill="#BAE6FD" text-anchor="middle" letter-spacing="4">1811</text>
  </g>
</svg>
