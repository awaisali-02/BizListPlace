<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#1B1242"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Badge -->
  <rect x="15" y="15" width="170" height="170" rx="36" fill="url(#orbitBg)"/>
  
  <!-- Outer Orbit Ring -->
  <path d="M 68 100 A 36 36 0 1 1 136 82" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Growth Chart Arrow (Rising bar & arrow) -->
  <path d="M78 95 L95 82 L112 90 L138 62" fill="none" stroke="url(#neonGreen)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polygon points="130,58 144,60 142,74" fill="#4ADE80"/>
  
  <!-- Brand Name -->
  <text x="100" y="148" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Orbit Grow</text>
</svg>
